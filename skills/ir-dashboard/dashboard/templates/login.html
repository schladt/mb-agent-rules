<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ config.title or 'IR Dashboard' }} — Login</title>
<style>
:root {
  --bg: #0c1017;
  --surface: #131a27;
  --border: #1e2d42;
  --text: #e2e6eb;
  --text-dim: #5a6578;
  --accent: {{ config.accent_color or '#3b82f6' }};
  --danger: #ef4444;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 360px; text-align: center; }
.login-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.login-subtitle { font-size: 12px; color: var(--text-dim); margin-bottom: 28px; }
.login-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; margin-bottom: 16px; }
.login-input:focus { border-color: var(--accent); }
.login-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.login-btn:hover { opacity: 0.9; }
.login-error { color: var(--danger); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<form class="login-box" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% if config.logo_url %}<img src="{{ config.logo_url }}" alt="" style="height:32px;margin-bottom:16px">{% endif %}
  <div class="login-title">{{ config.title or 'IR Dashboard' }}</div>
  <div class="login-subtitle">Enter the dashboard password to continue</div>
  {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
  <input class="login-input" type="password" name="password" placeholder="Password" autofocus required>
  <button class="login-btn" type="submit">Sign In</button>
</form>
</body>
</html>
